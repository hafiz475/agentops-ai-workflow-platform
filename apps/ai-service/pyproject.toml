[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentops-ai-service"
version = "0.1.0"
description = "AgentOps Studio AI execution service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6,<1.0",
  "openai>=1.59.0,<2.0",
  "pydantic-settings>=2.7.0,<3.0",
  "uvicorn[standard]>=0.34.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0",
  "mypy>=1.14.0,<2.0",
  "pytest>=8.3.4,<9.0",
  "pytest-cov>=6.0.0,<7.0",
  "ruff>=0.8.4,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

