name: Deploy Azure VM

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AgentOps Azure VM
    if: >-
      vars.AZURE_VM_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-production
    steps:
      - name: Resolve commit to deploy
        id: deployment
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${WORKFLOW_RUN_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy and verify
        uses: azure/cli@v2
        env:
          DEPLOY_SHA: ${{ steps.deployment.outputs.sha }}
        with:
          inlineScript: |
            set -Eeuo pipefail
            deployment_script="$(cat <<EOF
            set -eu
            cd /opt/agentops-ai-workflow-platform
            git fetch --prune origin main
            git checkout main
            git merge --ff-only ${DEPLOY_SHA}
            bash ./scripts/deploy-azure-vm.sh ${DEPLOY_SHA}
            EOF
            )"

            az vm run-command invoke \
              --resource-group rg-agentops-demo \
              --name vm-agentops-demo \
              --command-id RunShellScript \
              --scripts "$deployment_script" \
              --query 'value[0].message' \
              --output tsv | tee deployment-output.txt

            if ! grep -Fq "DEPLOYMENT_SUCCEEDED_SHA=${DEPLOY_SHA}" deployment-output.txt; then
              diagnostic="$(tail -c 6000 deployment-output.txt)"
              diagnostic="${diagnostic//'%'/'%25'}"
              diagnostic="${diagnostic//$'\n'/'%0A'}"
              diagnostic="${diagnostic//$'\r'/'%0D'}"
              echo "::error title=Azure deployment verification failed::${diagnostic}"
              exit 1
            fi
